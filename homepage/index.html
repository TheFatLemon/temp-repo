        <script>

            function blink()
            {
                let joke = document.querySelector('#thejoke');
                if (joke.style.visibility == 'hidden')
                {
                    joke.style.visibility = 'visible';
                }
                else
                {
                    joke.style.visibility = 'hidden';
                }
            }

            window.setInterval(blink, 500);

        </script>
