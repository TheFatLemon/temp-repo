<!DOCTYPE html>
<html lang="en">
    <head>
        <title>Scoreboard</title>
        <style>

            table {
                border: 2px solid black;
                border-collapse: collapse;
                margin-left: auto;
                margin-right: auto;
                text-align: center;
            }

            td {
                border: 2px solid black;
            }

            .team
            {
                background-color: #D8Bfdf;
            }

            #add1
            {
                background-color: red;
            }

            #add2
            {
                background-color: blue;
            }

            #top {
                text-align: center;
            }

        </style>
    </head>
    <body id="bgColor">
        <header id="top">JavaScript example</header><hr>
        <h1 style="text-align: center;">Team Red vs. Team Blue</h1>
        <p id="feedback"></p>
        <table>
            <tr>
                <td class="team">Team Red</td>
                <td class="team">Team Blue</td>
            </tr>
            <tr>
                <td id="score1">0</td>
                <td id="score2">0</td>
            </tr>
            <tr>
                <td>
                    <button id="add1">+1</button>
                </td>
                <td>
                    <button id="add2">+1</button>
                </td>
            </tr>
        </table><hr>
        <a href="index.html" class="btn btn-primary me-2">Go back</a>
        <script>
            let team1 = 0;
            let team2 = 0;

            document.querySelector('#add1').onclick = function() {
                team1++;
                document.querySelector('#score1').innerHTML = team1;
                if (team1 == 5)
                {
                    document.querySelector('#feedback').innerHTML = "Team Red won!";
                    document.querySelector('#score1').style.backgroundColor = "Green";
                    document.querySelector('#score2').style.backgroundColor = "Red";
                    document.querySelector('#bgColor').style.backgroundColor = "#ff9999";
                }
            }

            document.querySelector('#add2').onclick = function() {
                team2++;
                document.querySelector('#score2').innerHTML = team2;
                if (team2 == 5)
                {
                    document.querySelector('#feedback').innerHTML = "Team Blue won!";
                    document.querySelector('#score1').style.backgroundColor = "Red";
                    document.querySelector('#score2').style.backgroundColor = "Green";
                    document.querySelector('#bgColor').style.backgroundColor = "#9999ff";
                }
            }

    </script>
  </body>
</html>
