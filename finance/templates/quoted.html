{% extends "layout.html" %}

{% block title %}
    Stock Quote
{% endblock %}

{% block main %}
    <h2>Quote Result</h2>

    <p><strong>Stock:</strong> {{ stock.name }} ({{ stock.symbol }})</p>
    <p><strong>Price:</strong> {{ stock.price | usd }}</p>

    <a class="btn btn-secondary" href="/quote">Get another quote</a>
{% endblock %}
